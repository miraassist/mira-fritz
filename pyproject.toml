# Python tooling for the Home Assistant integration in custom_components/mira_fritz.
[project]
name = "mira-fritz"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
test = ["pytest-homeassistant-custom-component"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
